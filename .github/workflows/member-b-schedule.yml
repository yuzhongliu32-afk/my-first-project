name: Member B schedule forecast integration tests

on:
  push:
    branches:
      - member-b-predictive-scheduling-supplement
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-live.txt
      - name: Compile B and integration modules
        run: python -m compileall -q harbourline modules tests
      - name: Run complete A/B/C and B schedule regression suite
        run: python -m unittest discover -s tests -v
