name: Member B AI and A-B-C integration tests

on:
  push:
    branches:
      - validation/member-b-ai-tests-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and live-mode dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-live.txt
      - name: Compile all Python files
        run: python -m compileall -q harbourline modules tests
      - name: Run Member B and all A/B/C integration tests (scripted model)
        run: python -m unittest discover -s tests -v
